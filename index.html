<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StockEye 股票估值器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC",
        "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .app {
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding: 28px 22px 50px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-top: 10px;
    }

    .title {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin: 8px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 55px;
      padding: 0 16px;
      font-size: 20px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      height: 55px;
      margin-top: 15px;
      border: 0;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .quick {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .quick button {
      height: 38px;
      margin-top: 0;
      background: #f3f4f6;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    .status {
      margin-top: 25px;
      text-align: center;
      color: #6b7280;
      white-space: pre-line;
      line-height: 1.6;
    }

    .loading {
      color: #374151;
    }

    .error {
      color: #b91c1c;
    }

    .result {
      display: none;
      margin-top: 25px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 22px;
    }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .stock-name {
      font-size: 25px;
      font-weight: 800;
    }

    .stock-code {
      margin-top: 4px;
      color: #6b7280;
      font-size: 16px;
    }

    .market-tag {
      background: #e8f5ee;
      color: #18794e;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .date {
      color: #6b7280;
      margin-top: 15px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid #eef0f2;
    }

    .card-title {
      color: #6b7280;
      font-size: 14px;
    }

    .card-value {
      font-size: 22px;
      font-weight: 800;
      margin-top: 6px;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .source {
      margin-top: 20px;
      font-size: 13px;
      color: #6b7280;
      text-align: right;
    }

    .notice {
      margin-top: 22px;
      padding: 16px;
      background: #fff7ed;
      border-radius: 14px;
      line-height: 1.7;
      font-size: 14px;
      color: #7c4a03;
    }

    .next {
      margin-top: 15px;
      padding: 16px;
      background: #eff6ff;
      border-radius: 14px;
      line-height: 1.7;
      font-size: 14px;
      color: #1e40af;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 30px;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .wide {
        grid-column: auto;
      }
    }
  </style>
</head>


<body>

  <div class="app">

    <div class="logo">📊</div>

    <div class="title">
      StockEye
    </div>

    <div class="subtitle">
      我的股票估值器<br>
      輸入股票代號，讀取證交所真實資料
    </div>


    <label for="stockInput">
      股票代號
    </label>

    <input
      id="stockInput"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="例如：2330"
      autocomplete="off"
    >


    <button id="searchButton" onclick="loadStock()">
      查詢股票
    </button>


    <div class="quick">

      <button onclick="quickSearch('2330')">
        2330
      </button>

      <button onclick="quickSearch('2317')">
        2317
      </button>

      <button onclick="quickSearch('2303')">
        2303
      </button>

    </div>


    <div id="status" class="status"></div>


    <div id="result" class="result">

      <div class="stock-header">

        <div>
          <div id="stockName" class="stock-name">
            --
          </div>

          <div id="stockCode" class="stock-code">
            --
          </div>
        </div>

        <div class="market-tag">
          上市
        </div>

      </div>


      <div id="dataDate" class="date">
        --
      </div>


      <div class="grid">

        <div class="card">

          <div class="card-title">
            本益比 P/E
          </div>

          <div id="pe" class="card-value">
            --
          </div>

        </div>


        <div class="card">

          <div class="card-title">
            股價淨值比 P/B
          </div>

          <div id="pb" class="card-value">
            --
          </div>

        </div>


        <div class="card wide">

          <div class="card-title">
            殖利率
          </div>

          <div id="yield" class="card-value">
            --
          </div>

        </div>

      </div>


      <div class="notice">
        📌 目前這一版顯示的是證交所真實資料，
        還沒有加入「便宜／合理／偏貴」判斷。
        我們會在取得股價、EPS 與歷史估值資料後，
        再建立正式的估值模型。
      </div>


      <div class="next">
        🚧 StockEye 下一階段：
        加入目前股價、EPS、合理本益比區間，
        最後計算合理價範圍。
      </div>


      <div class="source">
        資料來源：臺灣證券交易所 TWSE
      </div>

    </div>


    <div class="footer">
      StockEye 僅提供資料整理與估值參考<br>
      不構成任何投資建議
    </div>

  </div>


  <script>

    /*
      ==========================================
      StockEye API
      ==========================================
    */

    const API =
      "https://stockeye-api.wpeanut001.workers.dev/";


    /*
      ==========================================
      查詢股票
      ==========================================
    */

    async function loadStock() {

      const input =
        document.getElementById("stockInput");

      const code =
        input.value.trim();


      const status =
        document.getElementById("status");

      const result =
        document.getElementById("result");

      const searchButton =
        document.getElementById("searchButton");


      /*
        檢查有沒有輸入
      */

      if (!code) {

        alert("請先輸入股票代號 😊");

        input.focus();

        return;
      }


      /*
        基本格式檢查
      */

      if (!/^[0-9]{4,6}$/.test(code)) {

        status.className =
          "status error";

        status.innerText =
          "股票代號格式好像不對喔。\n請輸入例如 2330。";

        result.style.display =
          "none";

        return;
      }


      /*
        顯示讀取中
      */

      status.className =
        "status loading";

      status.innerText =
        "正在取得證交所資料…";

      result.style.display =
        "none";

      searchButton.disabled =
        true;

      searchButton.innerText =
        "查詢中…";


      try {

        /*
          呼叫我們自己的
          Cloudflare Worker
        */

        const response =
          await fetch(
            API +
            "?code=" +
            encodeURIComponent(code)
          );


        /*
          讀取 JSON
        */

        const data =
          await response.json();


        /*
          API 回傳失敗
        */

        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.error ||
            "目前找不到這個股票代號"
          );
        }


        /*
          股票資料
        */

        const stock =
          data.stock;


        /*
          顯示股票名稱
        */

        document.getElementById(
          "stockName"
        ).innerText =
          stock.name || "未知股票";


        /*
          顯示股票代號
        */

        document.getElementById(
          "stockCode"
        ).innerText =
          stock.code || code;


        /*
          P/E
        */

        document.getElementById(
          "pe"
        ).innerText =
          formatNumber(stock.pe, " 倍");


        /*
          P/B
        */

        document.getElementById(
          "pb"
        ).innerText =
          formatNumber(stock.pb, " 倍");


        /*
          殖利率
        */

        document.getElementById(
          "yield"
        ).innerText =
          formatNumber(
            stock.dividendYield,
            "%"
          );


        /*
          日期
        */

        document.getElementById(
          "dataDate"
        ).innerText =
          "證交所資料日期：" +
          formatROCDate(stock.date);


        /*
          清除讀取文字
        */

        status.innerText =
          "";


        /*
          顯示結果
        */

        result.style.display =
          "block";

      }

      catch (error) {

        console.error(error);


        status.className =
          "status error";

        status.innerText =
          "查詢失敗 😢\n" +
          error.message;


        result.style.display =
          "none";

      }

      finally {

        searchButton.disabled =
          false;

        searchButton.innerText =
          "查詢股票";

      }

    }


    /*
      ==========================================
      快速查詢
      ==========================================
    */

    function quickSearch(code) {

      document.getElementById(
        "stockInput"
      ).value = code;

      loadStock();

    }


    /*
      ==========================================
      數字格式
      ==========================================
    */

    function formatNumber(
      value,
      suffix = ""
    ) {

      if (
        value === undefined ||
        value === null ||
        value === "" ||
        value === "-"
      ) {

        return "無資料";

      }


      const number =
        Number(value);


      if (Number.isNaN(number)) {

        return value + suffix;

      }


      return (
        number.toLocaleString(
          "zh-TW",
          {
            maximumFractionDigits: 2
          }
        ) +
        suffix
      );

    }


    /*
      ==========================================
      民國日期轉西元日期

      例如：
      1150924
      ↓
      2026/09/24
      ==========================================
    */

    function formatROCDate(
      dateString
    ) {

      if (!dateString) {

        return "未知";

      }


      const value =
        String(dateString).trim();


      if (value.length !== 7) {

        return value;

      }


      const rocYear =
        parseInt(
          value.substring(0, 3),
          10
        );


      const year =
        rocYear + 1911;


      const month =
        value.substring(3, 5);


      const day =
        value.substring(5, 7);


      return (
        year +
        "/" +
        month +
        "/" +
        day
      );

    }


    /*
      ==========================================
      按 Enter 也可以查詢
      ==========================================
    */

    document.getElementById(
      "stockInput"
    ).addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          loadStock();

        }

      }
    );

  </script>

</body>

</html>
